<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>藤の栞 | プロンプト図鑑</title><style>
:root{--main:#9d85c9;--deep:#69518f;--ink:#302b38;--muted:#817a8c;--line:#ddd6e7;--pale:#f5f1fa;--bg:#fbfafc}
*{box-sizing:border-box}
html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;line-height:1.75;letter-spacing:.02em}
button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--deep);outline-offset:3px}
header{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;backdrop-filter:blur(15px)}
.top{width:min(1150px,91%);margin:auto;display:flex;align-items:center;justify-content:space-between;padding:15px 0;gap:14px}
.brand{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:500;font-size:25px;letter-spacing:.18em;color:var(--deep);white-space:nowrap;display:flex;align-items:center;gap:13px}
.brand::first-letter{color:var(--main)}.small{font-size:12px;color:var(--muted)}
main{width:min(1150px,91%);margin:0 auto;padding-bottom:100px}
.hero{text-align:center;padding:70px 0 45px;position:relative}.hero::before,.hero::after{content:"";position:absolute;top:50%;height:1px;width:min(15%,150px);background:linear-gradient(90deg,transparent,var(--main))}.hero::before{left:2%}.hero::after{right:2%;transform:rotate(180deg)}
.hero h1{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:500;font-size:clamp(40px,6vw,62px);letter-spacing:.28em;margin:10px 0 3px;color:#4a3d60}.hero p{color:var(--muted);font-size:12px;letter-spacing:.17em}.accent{color:var(--deep);font:11px Georgia,serif;letter-spacing:.32em}
.btn{border:1px solid var(--line);background:#fff;color:var(--deep);border-radius:0;padding:9px 16px;letter-spacing:.045em;transition:background .18s,border-color .18s,transform .18s}.btn:hover{border-color:var(--main);background:var(--pale);transform:translateY(-1px)}.btn.primary{background:var(--deep);color:white;border-color:var(--deep)}.btn.primary:hover{background:var(--main);border-color:var(--main)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin:22px 0 24px;flex-wrap:wrap}
.search{border:1px solid var(--line);border-radius:0;padding:12px 16px;min-width:min(100%,350px);background:white;color:var(--ink)}.search:focus{border-color:var(--main)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.character{background:white;border:1px solid var(--line);border-radius:0;text-align:left;overflow:hidden;padding:0;color:inherit;transition:transform .22s,border-color .22s,box-shadow .22s;position:relative}.character:hover{transform:translateY(-5px);border-color:var(--main);box-shadow:9px 9px 0 #e9e1f1}.character::after{content:"";position:absolute;right:14px;bottom:19px;width:8px;height:8px;background:var(--main);transform:rotate(45deg)}
.art{aspect-ratio:3/4;background:linear-gradient(145deg,#e2daeb 0%,#f8f5fb 80%);display:grid;place-items:center;font:italic 44px Georgia;color:var(--main);overflow:hidden}.art img{width:100%;height:100%;object-fit:cover;display:block}.cardbody{padding:14px 35px 18px 16px;border-top:1px solid var(--line)}.cardbody strong{display:block;font-family:"Yu Mincho",serif;font-size:18px;font-weight:500;letter-spacing:.08em}.cardbody span{font-size:10px;color:var(--muted);letter-spacing:.07em}
.panel{background:white;border:1px solid var(--line);border-radius:0;padding:27px;position:relative}.panel::before{content:"";position:absolute;top:-1px;left:-1px;background:var(--main);width:52px;height:2px}
.view{display:none}.view.active{display:block}.detailtop{display:grid;grid-template-columns:minmax(180px,270px) 1fr;gap:30px}.detailtop .art{border-radius:0;overflow:hidden;border:1px solid var(--line)}.detailtop h2{font-family:"Yu Mincho",serif;font-weight:500;font-size:30px;letter-spacing:.1em}
.tag{display:inline-block;background:#f2eef8;color:var(--deep);padding:3px 15px;border-radius:0;font-size:11px;margin:0 7px 7px 0;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);letter-spacing:.05em}
.sectiontitle{font-family:Georgia,"Yu Mincho",serif;font-size:23px;font-weight:500;letter-spacing:.09em;margin:34px 0 16px;display:flex;align-items:center;gap:12px}.sectiontitle::before{content:"";display:inline-block;flex:none;width:9px;height:9px;background:var(--main);transform:rotate(45deg)}
.builder{display:grid;grid-template-columns:1fr 1fr;gap:15px}.part{border:1px solid var(--line);border-radius:0;padding:17px;background:#fff;position:relative}.part::before{content:"";position:absolute;top:-1px;left:-1px;width:28px;height:2px;background:var(--main)}.parthead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.parthead strong{font-size:13px;letter-spacing:.07em}.part input[type=checkbox]{accent-color:var(--deep)}.part select{width:100%;border:1px solid var(--line);padding:10px;border-radius:0;background:#fff;color:var(--ink)}.part small{display:block;margin-top:10px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.output{background:#f8f5fb;border:1px solid var(--line);border-left:3px solid var(--main);padding:20px;border-radius:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.85;min-height:85px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.muted{color:var(--muted)}.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.field{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:500;letter-spacing:.04em}.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:0;padding:11px;background:white;color:var(--ink);width:100%;font-weight:400}textarea{resize:vertical;min-height:85px}.wide{grid-column:1/-1}.rows{display:grid;gap:12px}.variant{border:1px solid var(--line);border-radius:0;padding:14px;display:grid;grid-template-columns:1fr 1fr auto;gap:9px;align-items:start}.variant textarea{grid-column:1/3;min-height:70px}
.hint{background:#f6f3fa;padding:15px 18px;border-radius:0;border-left:2px solid var(--main);font-size:12px;color:var(--deep)}.label{font-size:11px;color:var(--muted);margin-bottom:3px;letter-spacing:.16em}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:9px;margin:26px 0 12px}.sectionhead h3{font-size:16px;margin:0;letter-spacing:.07em}.hidden{display:none!important}
/* diagonal accent reserved for the primary copy action */
#copyAll{clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);padding-left:24px;padding-right:24px}
@media(max-width:800px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.hero{padding:43px 0 28px}.hero h1{font-size:37px}.hero::before,.hero::after{width:8%}.detailtop{grid-template-columns:115px 1fr;gap:15px}.detailtop h2{font-size:23px;margin:8px 0}.builder,.editgrid{grid-template-columns:1fr}.variant{grid-template-columns:1fr}.variant textarea{grid-column:auto}.panel{padding:17px}.top{gap:7px;padding:12px 0}.brand{font-size:19px;gap:5px}.btn{padding:8px 10px;font-size:12px}.sectiontitle{font-size:21px}.cardbody{padding:11px 24px 14px 11px}.cardbody strong{font-size:15px}.character::after{right:11px;bottom:14px;width:6px;height:6px}}

/* 2026 refined ornamental layer: quiet architectural lines, diamond seals and wisteria haze */
body{background:radial-gradient(ellipse 560px 380px at 100% 120px,rgba(183,161,216,.11),transparent 73%),radial-gradient(ellipse 580px 450px at 0 670px,rgba(209,195,229,.13),transparent 73%),#fcfbfd}
header{border-bottom:1px solid #e6dfee;box-shadow:0 6px 26px rgba(62,42,83,.025)}
.top{position:relative}.top::after{content:"";position:absolute;bottom:-1px;left:0;width:86px;height:2px;background:linear-gradient(90deg,var(--deep),#d7c5eb,transparent)}
.brand{gap:10px}.brand-mark{display:inline-grid;place-items:center;position:relative;width:29px;height:29px;border:1px solid #c7b5de;transform:rotate(45deg);flex:none}.brand-mark::after{content:"";width:9px;height:9px;background:#a48cc8;border:1px solid #fff}.brand-name{display:inline-block}
.hero{isolation:isolate;min-height:268px;padding:67px 20px 48px;margin:0 -12px 14px;overflow:hidden}
.hero::before,.hero::after{content:"";width:130px;height:130px;top:31px;left:clamp(-87px,5vw,58px);border:1px solid rgba(165,139,201,.23);background:none;transform:rotate(45deg);z-index:-1}
.hero::after{left:auto;right:clamp(-87px,5vw,58px);top:63px;width:88px;height:88px;transform:rotate(45deg)}
.hero-hairline{height:1px;max-width:580px;margin:23px auto 0;background:linear-gradient(90deg,transparent 0%,#d1bee7 35%,#a68ac7 50%,#d1bee7 65%,transparent 100%);position:relative}
.hero-hairline::after{content:"";position:absolute;left:calc(50% - 4px);top:-4px;width:8px;height:8px;background:#a48bc8;transform:rotate(45deg);border:2px solid #fcfbfd}
.hero-ornament{display:flex;justify-content:center;align-items:center;gap:11px;margin-bottom:9px;color:#9173b2;font:10px Georgia,serif;letter-spacing:.36em}
.hero-ornament::before,.hero-ornament::after{content:"";height:1px;width:30px;background:#d1bfdf}
.hero h1{margin-top:9px;text-shadow:0 3px 19px rgba(138,106,174,.055)}
.site-edge{position:fixed;pointer-events:none;z-index:0;top:115px;bottom:36px;width:1px;background:linear-gradient(180deg,transparent,#dfd3ec 24%,#dfd3ec 75%,transparent);opacity:.65}
.site-edge.left{left:max(13px,calc((100vw - 1220px)/2))}.site-edge.right{right:max(13px,calc((100vw - 1220px)/2))}
main{position:relative;z-index:1}
.sectiontitle{gap:15px;padding-bottom:12px;border-bottom:1px solid #e9e2ef;margin-bottom:22px;position:relative}
.sectiontitle::before{width:8px;height:8px;border:1px solid #8d70b4;background:#fff;box-shadow:inset 0 0 0 2px #fff;transform:rotate(45deg)}
.sectiontitle::after{content:"";position:absolute;width:68px;height:1px;bottom:-1px;left:0;background:var(--main)}
.character{box-shadow:0 7px 21px rgba(62,42,83,.035)}
.character::before{content:"";position:absolute;z-index:1;top:10px;left:10px;width:23px;height:23px;border-top:1px solid rgba(255,255,255,.8);border-left:1px solid rgba(255,255,255,.8);pointer-events:none}
.character:hover{box-shadow:7px 7px 0 #e9e1f1,0 12px 27px rgba(69,42,91,.055)}
.cardbody{position:relative}.cardbody::before{content:"";position:absolute;top:0;left:16px;width:38px;height:1px;background:#a78bc7}
.panel{box-shadow:0 9px 30px rgba(73,53,92,.025)}.panel::before{width:73px;background:linear-gradient(90deg,#9271bd,#d9c9e7)}
.part{box-shadow:0 4px 16px rgba(73,53,92,.023)}
.part::before{width:39px;background:linear-gradient(90deg,#9d85c9,#dccdeb)}
.output{background:linear-gradient(135deg,#f9f7fc,#f5f0fa)}
.foot-ornament{display:flex;justify-content:center;align-items:center;gap:16px;margin:63px auto 0;color:#9b8aa9;font:10px Georgia,serif;letter-spacing:.24em}
.foot-ornament::before,.foot-ornament::after{content:"";height:1px;width:min(16%,110px);background:linear-gradient(90deg,transparent,#bba7d2)}
.foot-ornament::after{transform:rotate(180deg)}
.foot-diamond{width:7px;height:7px;transform:rotate(45deg);background:#b39bce;display:inline-block;margin-right:4px}
@media(max-width:600px){.hero{min-height:205px;padding:43px 8px 33px}.hero::before{width:63px;height:63px;left:-32px;top:40px}.hero::after{width:53px;height:53px;right:-25px;top:85px}.hero-hairline{margin-top:17px}.site-edge{display:none}.brand-mark{width:20px;height:20px}.brand-mark::after{width:6px;height:6px}.sectiontitle{padding-bottom:9px;margin-bottom:18px}.foot-ornament{margin-top:43px}}
@media(prefers-reduced-motion:reduce){.character,.btn{transition:none}}
</style></head><body><div class="site-edge left" aria-hidden="true"></div><div class="site-edge right" aria-hidden="true"></div><header><div class="top"><div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">藤の栞</span></div><div style="display:flex;gap:8px"><button class="btn" id="homeBtn">図鑑を見る</button></div></div></header><main><section class="hero"><div class="hero-ornament">◇ &nbsp; WISTERIA ARCHIVE &nbsp; ◇</div><h1>藤の栞</h1><p>ひとつひとつの物語を、栞のように。</p><div class="hero-hairline" aria-hidden="true"></div></section>
<section id="listView" class="view active"><div class="toolbar"><div><h2 class="sectiontitle" style="margin:0">Characters</h2><span class="small" id="count"></span></div><input id="search" class="search" placeholder="キャラクター名・タグで検索"></div><div id="cards" class="grid"></div></section>
<section id="detailView" class="view"><div class="toolbar"><button class="btn" id="backBtn">← 一覧に戻る</button></div><div id="profile" class="panel"></div><h2 class="sectiontitle">Prompt Builder <span class="small">パーツを選んで組み合わせる</span></h2><div id="builder" class="builder"></div><h2 class="sectiontitle">完成プロンプト</h2><div class="panel"><div id="output" class="output"></div><div class="actions"><button id="copyAll" class="btn primary">⧉ まとめてコピー</button><button id="copyNegative" class="btn">ネガティブをコピー</button></div></div></section>
<div class="foot-ornament" aria-hidden="true"><span class="foot-diamond"></span> FUJI NO SHIORI</div></main><script>
let characters=[];
let currentId=null,options={};const $=id=>document.getElementById(id),uid=()=>('id-'+Math.random().toString(36).slice(2,11));function node(tag,cls,text){let el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}function show(page){for(let id of ['listView','detailView'])$(id).classList.toggle('active',id===page);window.scrollTo(0,0)}function art(c){const a=node('div','art');if(c.image){const img=document.createElement('img');img.src=c.image;img.alt=c.name;a.append(img)}else a.textContent='✦';return a}function renderList(){let q=$('search').value.toLowerCase(),matches=characters.filter(c=>[c.name,c.intro,...c.tags].join(' ').toLowerCase().includes(q));$('cards').replaceChildren();for(const c of matches){let b=node('button','character');b.append(art(c));let body=node('div','cardbody');body.append(node('strong','',c.name),node('span','',c.tags.join(' / ')));b.append(body);b.onclick=()=>detail(c.id);$('cards').append(b)}$('count').textContent=`${matches.length} characters`}function detail(id){currentId=id;options={};let c=characters.find(x=>x.id===id);if(!c){show('listView');return}let top=node('div','detailtop'),info=node('div');info.append(node('div','label','CHARACTER PROFILE'),node('h2','',c.name),node('p','muted',c.intro));for(let t of c.tags)info.append(node('span','tag',t));top.append(art(c),info);$('profile').replaceChildren(top);renderBuilder(c);show('detailView')}function renderBuilder(c){$('builder').replaceChildren();for(let p of c.parts){if(!p.variants.length)continue;if(!options[p.id])options[p.id]={index:0,enabled:true};let setting=options[p.id],box=node('div','part'),head=node('div','parthead'),name=node('strong','',p.name),label=node('label','small','使う '),toggle=document.createElement('input');toggle.type='checkbox';toggle.checked=setting.enabled;toggle.onchange=()=>{setting.enabled=toggle.checked;sel.disabled=!setting.enabled;refreshOutput(c)};label.prepend(toggle);head.append(name,label);let sel=document.createElement('select');p.variants.forEach((v,i)=>{let op=document.createElement('option');op.value=i;op.textContent=v.name;sel.append(op)});sel.value=Math.min(setting.index,p.variants.length-1);sel.disabled=!setting.enabled;let preview=node('small','',p.variants[Number(sel.value)].text);sel.onchange=()=>{setting.index=Number(sel.value);preview.textContent=p.variants[setting.index].text;refreshOutput(c)};const single=node('button','btn','このパーツをコピー');single.style.marginTop='10px';single.onclick=()=>copyText(p.variants[setting.index].text,single);box.append(head,sel,preview,single);$('builder').append(box)}refreshOutput(c)}function refreshOutput(c){let snippets=c.parts.filter(p=>p.variants.length&&options[p.id]?.enabled).map(p=>p.variants[Math.min(options[p.id].index,p.variants.length-1)].text.trim()).filter(Boolean);$('output').textContent=snippets.join(',\n')||'使うパーツを選択してください。';$('copyAll').disabled=!snippets.length;$('copyNegative').disabled=!c.negative}
async function copyText(t,btn){try{await navigator.clipboard.writeText(t)}catch{let ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();let ok=document.execCommand('copy');ta.remove();if(!ok){alert('コピーに失敗しました。テキストを選択してコピーしてください。');return}}let old=btn.textContent;btn.textContent='✓ コピーしました';setTimeout(()=>btn.textContent=old,1600)}$('copyAll').onclick=()=>copyText($('output').textContent,$('copyAll'));$('copyNegative').onclick=()=>copyText(characters.find(c=>c.id===currentId).negative,$('copyNegative'));$('search').oninput=renderList;$('homeBtn').onclick=()=>{renderList();show('listView')};$('backBtn').onclick=()=>{renderList();show('listView')};
fetch('./data.json', {cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{if(!Array.isArray(data.characters))throw Error('Invalid data');characters=data.characters;renderList()}).catch(err=>{document.getElementById('count').textContent='データを読み込めませんでした。';console.error(err)});
</script></body></html>
